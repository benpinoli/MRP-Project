name: Samsung research validation
on:
  push:
    paths: ['src/samsung_research/**', 'scripts/**', 'slurm/**', 'tests/check_*.py', 'methodology/**', 'docs/METHODOLOGY.md', 'docs/regressions/**', 'configs/**', 'research/*requirements.lock', '.github/workflows/samsung-research.yml']
  pull_request:
    paths: ['src/samsung_research/**', 'scripts/**', 'slurm/**', 'tests/check_*.py', 'methodology/**', 'docs/METHODOLOGY.md', 'docs/regressions/**', 'configs/**', 'research/*requirements.lock', '.github/workflows/samsung-research.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.lock -r research/regression-requirements.lock
      - run: for script in slurm/submit_samsung_regressions.sh slurm/worker.sbatch slurm/cluster.env.example.sh; do bash -n "$script" || exit; done
      - run: python -m unittest discover -s tests -p 'check_*.py'
